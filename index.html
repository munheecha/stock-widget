<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 위젯</title>

<style>

body{
    background:#111827;
    color:white;
    font-family:sans-serif;
    margin:0;
    padding:20px;
}

h1{
    margin-bottom:5px;
}

.time{
    color:#9ca3af;
    margin-bottom:20px;
}

.card{
    background:#1f2937;
    padding:18px;
    border-radius:12px;
    margin-bottom:12px;
}

.stock-name{
    font-size:18px;
    font-weight:bold;
}

.price{
    color:#22c55e;
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
    letter-spacing:1px;
}

</style>

</head>

<body>

<h1>📈 나의 주식 위젯</h1>

<div class="time" id="updateTime">
업데이트 중...
</div>

<div id="stocks"></div>

<script>

const stocks = [
{
    name:"삼성전자",
    symbol:"005930.KS"
},
{
    name:"KODEX 미국나스닥100",
    symbol:"379810.KS"
},
{
    name:"일진전기",
    symbol:"103590.KS"
}
];

async function getPrice(symbol){

    const res = await fetch(
        "https://stock-api.royental9.workers.dev/?symbol=" + symbol
    );

    const data = await res.json();

    return data.price;

}

function saveTarget(symbol,value){

    localStorage.setItem(
        "target_" + symbol,
        value
    );

}

function getTarget(symbol){

    return (
        localStorage.getItem(
            "target_" + symbol
        ) || ""
    );

}

async function loadStocks(){

    const area =
    document.getElementById("stocks");

    area.innerHTML="";

    for(const stock of stocks){

        const price =
        await getPrice(stock.symbol);

        const target =
        Number(
            getTarget(stock.symbol)
        );

        const displayPrice =
        Number(price)
        .toLocaleString("ko-KR");

        let remainText = "";
        let progressText = "";
        let reached = false;

        if(target > 0){

            const remain =
            target - price;

            const progress =
            ((price / target) * 100)
            .toFixed(1);

            progressText =
            "달성률 : "
            + progress + "%";

            if(remain <= 0){

                remainText =
                "🎉 목표 달성";

                reached = true;

                if(
                  Notification.permission
                  === "granted"
                ){

                    new Notification(
                      stock.name +
                      " 목표가 도달",
                      {
                        body:
                        displayPrice +
                        "원"
                      }
                    );

                }

            }else{

                remainText =
                "목표까지 "
                +
                remain.toLocaleString("ko-KR")
                +
                "원";

            }

        }

        area.innerHTML += `

        <div class="card"
             style="
             border:
             ${
               reached
               ? '2px solid #22c55e'
               : 'none'
             };
             ">

            <div class="stock-name">
                ${stock.name}
            </div>

            <div class="price">
                ${displayPrice}원
            </div>

            <div style="
              color:#d1d5db;
              margin-top:8px;">
              ${progressText}
            </div>

            <div style="
              color:${
                reached
                ? '#22c55e'
                : '#fbbf24'
              };
              margin-top:4px;">
              ${remainText}
            </div>

            <div
            style="margin-top:12px;">

                <input
                  id="input_${stock.symbol}"
                  type="number"
                  placeholder="목표가 입력"
                  value="${getTarget(stock.symbol)}"
                  style="
                  width:180px;
                  padding:8px;
                  border-radius:8px;
                  border:none;">

                <button
                onclick="
                saveTarget(
                  '${stock.symbol}',
                  document.getElementById(
                  'input_${stock.symbol}'
                  ).value
                );
                loadStocks();
                "
                style="
                padding:8px;
                margin-left:6px;">
                저장
                </button>

            </div>

        </div>

        `;
    }

    document
    .getElementById("updateTime")
    .innerText =
    "마지막 갱신 : "
    +
    new Date()
    .toLocaleTimeString();

}

if(
Notification.permission
!== "granted"
){
    Notification.requestPermission();
}

loadStocks();

setInterval(
    loadStocks,
    600000
);

</script>

</body>
</html>
