<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 위젯</title>

<link rel="icon" href="data:,">

<style>
body{
    background:#111827;
    color:white;
    font-family:sans-serif;
    margin:0;
    padding:20px;
}

h1{
    margin-bottom:5px;
}

.time{
    color:#9ca3af;
    margin-bottom:20px;
}

.card{
    background:#1f2937;
    padding:18px;
    border-radius:12px;
    margin-bottom:12px;
}

.stock-name{
    font-size:18px;
    font-weight:bold;
}

.price{
    color:#22c55e;
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}

input{
    width:180px;
    padding:8px;
    border:none;
    border-radius:8px;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    margin-left:5px;
    cursor:pointer;
}
</style>

</head>

<body>

<h1>📈 나의 주식 위젯</h1>

<div id="updateTime" class="time">
업데이트 중...
</div>

<div id="stocks"></div>

<script>

function saveTarget(symbol,value){

    const target = Number(value);

    if(!target || target <= 0){

        alert("목표가는 0보다 큰 숫자를 입력하세요.");
        return;

    }

    localStorage.setItem(
        "target_" + symbol,
        target
    );

    localStorage.removeItem(
        "notified_" + symbol
    );

    loadStocks();

}

function getTarget(symbol){

    return localStorage.getItem(
        "target_" + symbol
    ) || "";

}

function notifyOnce(symbol){

    const key =
    "notified_" + symbol;

    if(localStorage.getItem(key)){
        return false;
    }

    localStorage.setItem(key,"Y");

    return true;

}

async function loadStocks(){

    const area =
    document.getElementById("stocks");

    area.innerHTML = "";

    try{

        const res = await fetch(
            "https://stock-api.royental9.workers.dev?t="
            + Date.now()
        );

        const stocks =
        await res.json();

        console.log(stocks);

        stocks.forEach(stock => {

            const target =
            Number(
                getTarget(stock.symbol)
            );

            let progressText = "";
            let remainText = "";
            let cardBorder = "";
            let progressColor = "#9ca3af";

            if(target > 0){

                const remain =
                target - stock.price;

                const progress =
                (
                    stock.price /
                    target * 100
                ).toFixed(1);

                progressText =
                "달성률 : " +
                progress + "%";

                if(progress < 80){

                    progressColor =
                    "#ef4444";

                }else if(progress < 100){

                    progressColor =
                    "#f59e0b";

                }else{

                    progressColor =
                    "#22c55e";

                }

                if(remain <= 0){

                    remainText =
                    "🎉 목표 달성";

                    cardBorder =
                    "border:2px solid #22c55e;";

                    if(
                        Notification.permission
                        === "granted"
                        &&
                        notifyOnce(
                            stock.symbol
                        )
                    ){

                        new Notification(
                            "🎉 목표가 도달",
                            {
                                body:
                                stock.name +
                                " 현재가 "
                                +
                                stock.price.toLocaleString("ko-KR")
                                +
                                "원"
                            }
                        );

                    }

                }else{

                    remainText =
                    "목표까지 "
                    +
                    remain.toLocaleString("ko-KR")
                    +
                    "원";

                }

            }

            area.innerHTML += `
            <div class="card"
                 style="${cardBorder}">

                <div class="stock-name">
                    ${stock.name}
                </div>

                <div class="price">
                    ${stock.price.toLocaleString("ko-KR")}원
                </div>

                <div style="
                    color:${progressColor};
                    margin-top:8px;">
                    ${progressText}
                </div>

                <div style="
                    color:#fbbf24;
                    margin-top:6px;">
                    ${remainText}
                </div>

                <div style="
                    margin-top:12px;">

                    <input
                        id="target_${stock.symbol}"
                        type="number"
                        value="${getTarget(stock.symbol)}"
                        placeholder="목표가 입력">

                    <button
                        onclick="
                        saveTarget(
                        '${stock.symbol}',
                        document.getElementById(
                        'target_${stock.symbol}'
                        ).value
                        );
                        ">
                        저장
                    </button>

                </div>

            </div>
            `;
        });

        document.getElementById(
            "updateTime"
        ).innerText =
        "마지막 갱신 : "
        +
        new Date()
        .toLocaleTimeString();

    }catch(err){

        console.error(err);

        area.innerHTML =
        "<h2>데이터 조회 실패</h2>";

    }

}

if(
    "Notification" in window &&
    Notification.permission !== "granted"
){
    Notification.requestPermission();
}

loadStocks();

setInterval(
    loadStocks,
    600000
);

</script>

</body>
</html>
