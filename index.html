function saveTarget(symbol,value){

    const target =
    Number(value);

    if(!target || target <= 0){

        alert(
        "목표가는 0보다 큰 숫자를 입력하세요."
        );

        return;

    }

    localStorage.setItem(
        "target_" + symbol,
        target
    );

    localStorage.removeItem(
        "notified_" + symbol
    );

    loadStocks();

}

function getTarget(symbol){

    return localStorage.getItem(
        "target_" + symbol
    ) || "";

}

function saveHolding(symbol){

    const qty =
    Number(
        document.getElementById(
            "qty_" + symbol
        ).value
    );

    const avg =
    Number(
        document.getElementById(
            "avg_" + symbol
        ).value
    );

    localStorage.setItem(
        "qty_" + symbol,
        qty
    );

    localStorage.setItem(
        "avg_" + symbol,
        avg
    );

    loadStocks();

}

function getHolding(symbol){

    return {

        qty:
        Number(
            localStorage.getItem(
                "qty_" + symbol
            )
        ) || 0,

        avg:
        Number(
            localStorage.getItem(
                "avg_" + symbol
            )
        ) || 0

    };

}

function notifyOnce(symbol){

    const key =
    "notified_" + symbol;

    if(
        localStorage.getItem(key)
    ){
        return false;
    }

    localStorage.setItem(
        key,
        "Y"
    );

    return true;

}
