<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 위젯</title>

<link rel="icon" href="data:,">

<style>
body {
    background: #111827;
    color: white;
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
}

h1 {
    margin-bottom: 5px;
}

.time {
    color: #9ca3af;
    margin-bottom: 20px;
}

.card {
    background: #1f2937;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 12px;
}

.stock-name {
    font-size: 18px;
    font-weight: bold;
}

.price {
    color: #22c55e;
    font-size: 28px;
    font-weight: bold;
    margin-top: 10px;
}

input {
    width: 180px;
    padding: 8px;
    border: none;
    border-radius: 8px;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    margin-left: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>📈 나의 주식 위젯</h1>

<div id="updateTime" class="time">
업데이트 중...
</div>

<div id="stocks"></div>

<script>
async function saveTarget(symbol, value) {
    const target = Number(value);

    if (!target || target <= 0) {
        alert("목표가는 0보다 큰 숫자를 입력하세요.");
        return;
    }

    try {
        const res = await fetch(
            "https://stock-api.royental9.workers.dev",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    symbol: symbol,
                    target: target
                })
            }
        );

        const result = await res.json();
        if (result.success) {
            alert("목표가 저장 완료");
            loadStocks();
        } else {
            alert("목표가 저장 실패: " + (result.error || "알 수 없는 오류"));
        }
    } catch (err) {
        console.error(err);
        alert("서버 통신 중 오류가 발생했습니다.");
    }
}

async function loadStocks() {
    const area = document.getElementById("stocks");
    area.innerHTML = "";

    try {
        const res = await fetch(
            "https://stock-api.royental9.workers.dev?t=" + Date.now()
        );

        const stocks = await res.json();

        // 만약 Worker에서 에러 객체를 리턴한 경우 처리
        if (stocks.error) {
            throw new Error(stocks.error);
        }

        stocks.forEach(stock => {
            // 서버(KV)에서 넘어온 target 값 사용 (없으면 0)
            const target = Number(stock.target) || 0;

            let progressText = "";
            let remainText = "";

            if (target > 0) {
                const remain = target - stock.price;
                const progress = (stock.price / target * 100).toFixed(1);

                progressText = "달성률 : " + progress + "%";

                if (remain <= 0) {
                    remainText = "🎉 목표 달성";
                } else {
                    remainText = "목표까지 " + remain.toLocaleString("ko-KR") + "원";
                }
            }

            area.innerHTML += `
            <div class="card">
                <div class="stock-name">
                    ${stock.name}
                </div>

                <div class="price">
                    ${stock.price ? stock.price.toLocaleString("ko-KR") + "원" : "조회 실패"}
                </div>

                <div style="margin-top:8px;">
                    ${progressText}
                </div>

                <div style="margin-top:6px;color:#fbbf24;">
                    ${remainText}
                </div>

                <div style="margin-top:12px;">
                    <input
                        id="target_${stock.symbol}"
                        type="number"
                        value="${target > 0 ? target : ''}"
                        placeholder="목표가 입력">

                    <button
                        onclick="saveTarget('${stock.symbol}', document.getElementById('target_${stock.symbol}').value)">
                        저장
                    </button>
                </div>
            </div>
            `;
        });

        document.getElementById("updateTime").innerText =
            "마지막 갱신 : " + new Date().toLocaleTimeString();

    } catch (err) {
        console.error(err);
        area.innerHTML = "<h2>데이터 조회 실패</h2>";
    }
}

// 최초 실행
loadStocks();

// 1분 주기 갱신
setInterval(loadStocks, 60000);
</script>

</body>
</html>
