<script>

const stockMap = {
    "삼성전자":"005930.KS",
    "KODEX 미국나스닥100":"379810.KS",
    "일진전기":"103590.KS"
};

let stocks = [
    "삼성전자",
    "KODEX 미국나스닥100",
    "일진전기"
];

async function getPrice(symbol){

    try{

        const res = await fetch(
            "https://stock-api.royental9.workers.dev/?symbol=" + symbol
        );

        const data = await res.json();

        return data.price;

    }catch(error){

        return "조회 실패";

    }

}

async function render(){

    const area =
    document.getElementById("stocks");

    area.innerHTML = "";

    for(const stock of stocks){

        const symbol =
        stockMap[stock];

        const price =
        await getPrice(symbol);

        area.innerHTML +=
        `
        <div class="card">

            <div>

                <div class="name">
                    ${stock}
                </div>

                <div class="price">
                    ${price}
                </div>

            </div>

        </div>
        `;
    }

}

render();

</script>
