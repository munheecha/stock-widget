<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 위젯</title>

<style>

body{
    background:#111827;
    color:white;
    font-family:sans-serif;
    margin:0;
    padding:20px;
}

h1{
    margin-bottom:5px;
}

.time{
    color:#9ca3af;
    margin-bottom:20px;
}

.card{
    background:#1f2937;
    padding:18px;
    border-radius:12px;
    margin-bottom:12px;
}

.stock-name{
    font-size:18px;
    font-weight:bold;
}

.price{
    color:#22c55e;
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
    letter-spacing:1px;
}

</style>

</head>

<body>

<h1>📈 나의 주식 위젯</h1>

<div class="time" id="updateTime">
업데이트 중...
</div>

<div id="stocks"></div>

<script>

const stocks = [

{
name:"삼성전자",
symbol:"005930.KS"
},

{
name:"KODEX 미국나스닥100",
symbol:"379810.KS"
},

{
name:"일진전기",
symbol:"103590.KS"
}

];

async function getPrice(symbol){

    const res =
    await fetch(
        "https://stock-api.royental9.workers.dev/?symbol=" + symbol
    );

    const data =
    await res.json();

    return data.price;

}

async function loadStocks(){

    const area =
    document.getElementById("stocks");

    area.innerHTML="";

    for(const stock of stocks){

        const price =
await getPrice(stock.symbol);

const displayPrice =
price
? Number(price).toLocaleString("ko-KR")
: "조회 실패";

        area.innerHTML +=

        `
        <div class="card">

            <div class="stock-name">
            ${stock.name}
            </div>

            <div class="price">
            ${displayPrice}
            </div>

        </div>
        `;
    }

    document.getElementById("updateTime")
    .innerText =
    "마지막 갱신 : "
    + new Date().toLocaleTimeString();

}

loadStocks();

setInterval(
    loadStocks,
    60000
);

</script>

</body>
</html>
