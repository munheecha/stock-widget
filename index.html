<div class="time" id="updateTime">

</div>

<div id="stocks"></div>

<script>

function notifyOnce(symbol){

    const key =
    "notified_" + symbol;

    if(
        localStorage.getItem(key)
    ){
        return false;
    }

    localStorage.setItem(
        key,
        "Y"
    );

    return true;

}

async function loadStocks(){

    const area =
    document.getElementById("stocks");

    area.innerHTML = "";

    try{

            + Date.now()
        );

        const stocks =
        await res.json();

            area.innerHTML =
            "<h2>API 오류</h2>";

            return;

                area.innerHTML += `

                        ${stock.name}

                    </div>

                </div>
