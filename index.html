<script>

const stocks = [
{
    name:"삼성전자",
    symbol:"005930.KS"
},
{
    name:"KODEX 미국나스닥100",
    symbol:"379810.KS"
},
{
    name:"일진전기",
    symbol:"103590.KS"
}
];

async function getPrice(symbol){

    try{

        const res = await fetch(
            "https://stock-api.royental9.workers.dev/?symbol="
            + symbol
            + "&t="
            + Date.now()
        );

        const data = await res.json();

        console.log("==========");
        console.log("심볼:", symbol);
        console.log("전체응답:", data);

        if(
            data.error ||
            data.price === undefined ||
            data.price === null
        ){

            console.error(
                "API 오류:",
                data
            );

            return null;

        }

        return Number(data.price);

    }catch(err){

        console.error(
            "조회실패:",
            err
        );

        return null;

    }

}

function saveTarget(symbol,value){

    const target = Number(value);

    if(!target || target <= 0){

        alert(
          "목표가는 0보다 큰 숫자를 입력하세요."
        );

        return false;

    }

    localStorage.setItem(
        "target_" + symbol,
        target
    );

    localStorage.removeItem(
        "notified_" + symbol
    );

    alert("목표가 저장 완료");

    return true;

}

function getTarget(symbol){

    return (
        localStorage.getItem(
            "target_" + symbol
        ) || ""
    );

}

async function loadStocks(){

    const area =
    document.getElementById("stocks");

    area.innerHTML = "";

    for(const stock of stocks){

        const price =
        await getPrice(stock.symbol);

        if(price === null){

            area.innerHTML += `
            <div class="card">

                <div class="stock-name">
                    ${stock.name}
                </div>

                <div class="price"
                     style="color:#ef4444">
                    조회 실패
                </div>

            </div>
            `;

            continue;

        }

        const target =
        Number(
            getTarget(stock.symbol)
        );

        const displayPrice =
        price.toLocaleString("ko-KR");

        let progressText = "";
        let remainText = "";
        let cardBorder = "";
        let progressColor = "#9ca3af";

        if(target > 0){

            const remain =
            target - price;

            const progress =
            (
                (price / target) * 100
            ).toFixed(1);

            progressText =
            "달성률 : "
            + progress
            + "%";

            if(progress < 80){

                progressColor =
                "#ef4444";

            }
            else if(progress < 100){

                progressColor =
                "#f59e0b";

            }
            else{

                progressColor =
                "#22c55e";

            }

            if(remain <= 0){

                remainText =
                "🎉 목표 달성";

                cardBorder =
                "border:2px solid #22c55e;";

            }else{

                remainText =
                "목표까지 "
                +
                remain.toLocaleString("ko-KR")
                +
                "원";

            }

        }

        area.innerHTML += `
        <div class="card"
             style="${cardBorder}">

            <div class="stock-name">
                ${stock.name}
            </div>

            <div class="price">
                ${displayPrice}원
            </div>

            <div
            style="
            color:${progressColor};
            margin-top:8px;">

                ${progressText}

            </div>

            <div
            style="
            color:#fbbf24;
            margin-top:6px;">

                ${remainText}

            </div>

            <div
            style="
            margin-top:12px;">

                <input
                    id="target_${stock.symbol}"
                    type="number"
                    value="${getTarget(stock.symbol)}"
                    placeholder="목표가 입력"
                    style="
                    width:180px;
                    padding:8px;
                    border:none;
                    border-radius:8px;">

                <button
                onclick="
                saveTarget(
                  '${stock.symbol}',
                  document.getElementById(
                  'target_${stock.symbol}'
                  ).value
                );
                loadStocks();
                "
                style="
                padding:8px 12px;
                border:none;
                border-radius:8px;
                margin-left:5px;
                cursor:pointer;">

                저장

                </button>

            </div>

        </div>
        `;

    }

    document
    .getElementById(
      "updateTime"
    )
    .innerText =
    "마지막 갱신 : "
    +
    new Date()
    .toLocaleTimeString();

}

loadStocks();

setInterval(
    loadStocks,
    600000
);

</script>
