<script>

function saveTarget(symbol,value){

    const target = Number(value);

    if(!target || target <= 0){

        alert("목표가는 0보다 큰 숫자를 입력하세요.");
        return;

    }

    localStorage.setItem(
        "target_" + symbol,
        target
    );

    localStorage.removeItem(
        "notified_" + symbol
    );

    loadStocks();

}

function getTarget(symbol){

    return localStorage.getItem(
        "target_" + symbol
    ) || "";

}

function notifyOnce(symbol){

    const key =
    "notified_" + symbol;

    if(localStorage.getItem(key)){
        return false;
    }

    localStorage.setItem(key,"Y");

    return true;

}

async function loadStocks(){

    const area =
    document.getElementById("stocks");

    area.innerHTML = "";

    try{

        const res = await fetch(
            "https://stock-api.royental9.workers.dev?t="
            + Date.now()
        );

        const stocks =
        await res.json();

        stocks.forEach(stock => {

            const target =
            Number(
                getTarget(stock.symbol)
            );

            let progressText = "";
            let remainText = "";
            let cardBorder = "";
            let progressColor = "#9ca3af";

            if(target > 0){

                const remain =
                target - stock.price;

                const progress =
                (
                    stock.price /
                    target * 100
                ).toFixed(1);

                progressText =
                "달성률 : "
                + progress + "%";

                if(progress < 80){

                    progressColor =
                    "#ef4444";

                }else if(progress < 100){

                    progressColor =
                    "#f59e0b";

                }else{

                    progressColor =
                    "#22c55e";

                }

                if(remain <= 0){

                    remainText =
                    "🎉 목표 달성";

                    cardBorder =
                    "border:2px solid #22c55e;";

                }else{

                    remainText =
                    "목표까지 "
                    +
                    remain.toLocaleString("ko-KR")
                    +
                    "원";

                }

            }

            area.innerHTML += `
            <div class="card"
                 style="${cardBorder}">

                <div class="stock-name">
                    ${stock.name}
                </div>

                <div class="price">
                    ${stock.price.toLocaleString("ko-KR")}원
                </div>

                <div style="
                    color:${progressColor};
                    margin-top:8px;">
                    ${progressText}
                </div>

                <div style="
                    color:#fbbf24;
                    margin-top:6px;">
                    ${remainText}
                </div>

                <div style="
                    margin-top:12px;">

                    <input
                        id="target_${stock.symbol}"
                        type="number"
                        value="${getTarget(stock.symbol)}"
                        placeholder="목표가 입력">

                    <button
                        onclick="
                        saveTarget(
                        '${stock.symbol}',
                        document.getElementById(
                        'target_${stock.symbol}'
                        ).value
                        );
                        ">
                        저장
                    </button>

                </div>

            </div>
            `;
        });

        document.getElementById(
            "updateTime"
        ).innerText =
        "마지막 갱신 : "
        +
        new Date()
        .toLocaleTimeString();

    }catch(err){

        console.error(err);

        area.innerHTML =
        "<h2>데이터 조회 실패</h2>";

    }

}

loadStocks();

setInterval(
    loadStocks,
    600000
);

</script>
